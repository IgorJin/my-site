services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: digital_card
      POSTGRES_PASSWORD: digital_card
      POSTGRES_DB: digital_card
    ports:
      - "5433:5432"
    volumes:
      - digital-card-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_card -d digital_card"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://digital_card:digital_card@postgres:5432/digital_card?schema=public
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  digital-card-postgres:
